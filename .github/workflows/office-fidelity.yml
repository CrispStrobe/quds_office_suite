name: Office fidelity oracles
on:
  push:
    branches: [main, crispcloud, 'feature/office-fidelity-*']
    paths:
      - 'packages/quds_office_engine/**'
      - 'packages/quds_office_editor/**'
      - 'packages/legacy_doc_parser/**'
      - '.github/workflows/office-fidelity.yml'
      - 'tool/office-validation/**'
      - 'docs/office-fidelity*'
      - 'pubspec.yaml'
  pull_request:
    paths:
      - 'packages/quds_office_engine/**'
      - 'packages/quds_office_editor/**'
      - 'packages/legacy_doc_parser/**'
      - '.github/workflows/office-fidelity.yml'
      - 'tool/office-validation/**'
      - 'docs/office-fidelity*'
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-fidelity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  office-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Engine suite and line coverage
        id: engine
        working-directory: packages/quds_office_engine
        run: |
          dart analyze
          python3 tool/fidelity/collect_coverage.py --dart "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" coverage/vm
          python3 tool/fidelity/feature_matrix.py run footnotes endnotes headings styles paragraphs images tables tocs textflow placement drawings references comments spreadsheets slides
          bash tool/fidelity/check.sh
          python3 tool/fidelity/coverage_report.py coverage/vm --require-receipt
      - name: Editor suite and reviewed visual goldens
        id: editor
        working-directory: packages/quds_office_editor
        run: |
          python3 ../quds_office_engine/tool/fidelity/inventory.py clean --package quds_office_editor --manifest ../quds_office_engine/tool/fidelity/editor_output_manifest.json --package-root .
          flutter test --no-pub
          python3 ../quds_office_engine/tool/fidelity/corpus.py verify build/fidelity
          python3 ../quds_office_engine/tool/fidelity/bookmarks_oracle.py --editor-dir build/fidelity-bookmarks-legacy
          python3 ../quds_office_engine/tool/fidelity/content_controls_oracle.py --editor-dir build/fidelity-content-controls-legacy
          python3 ../quds_office_engine/tool/fidelity/bookmark_copy_oracle.py --editor --root build/fidelity-bookmark-copy
          python3 ../quds_office_engine/tool/fidelity/inventory.py verify --package quds_office_editor --manifest ../quds_office_engine/tool/fidelity/editor_output_manifest.json --package-root .
      - name: Collect exported Office packages
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          for package in Path('packages').glob('quds_office_*'):
              for source in package.glob('build/fidelity*'):
                  target = Path('build/office-evidence') / package.name / source.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if source.is_dir():
                      shutil.copytree(source, target)
                  else:
                      shutil.copy2(source, target)
          PYTHON
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prove validator detects invalid XML
        run: dotnet run --project tool/office-validation -- --self-test
      - name: Validate exported Office packages
        run: dotnet run --project tool/office-validation -- build/office-evidence build/external/schema-report.json
      - name: Upload schema validation receipts
        if: ${{ always() && hashFiles('build/external/schema-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: office-fidelity-schema-receipts
          path: build/external/schema-report.json
          if-no-files-found: error
      - name: Install independent Office renderer
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && steps.editor.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils fonts-liberation fonts-dejavu
      - name: Render exports and compare repeated save cycles
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && steps.editor.outcome == 'success' }}
        run: |
          python3 -m unittest discover -s tool/office-validation -p 'test_*.py'
          python3 tool/office-validation/render.py build/office-evidence build/external-render --schema-report build/external/schema-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-fidelity-evidence
          path: |
            packages/quds_office_engine/build/fidelity*
            packages/quds_office_engine/coverage/
            packages/quds_office_editor/build/fidelity*
            packages/quds_office_editor/test/failures/
            build/external/
            build/external-render/render-report.json
            build/external-render/**/*.pdf
            build/external-render/**/*.png
